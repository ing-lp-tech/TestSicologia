<title>Cuestionarios TDAH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Achromatic ledger · open plane: barra lateral sobre el fondo (escritorio) que en el celular se pliega a una barra superior de 48px con menú.
   Grilla: lateral 256px + lienzo fluido con margen de 32px; contenido de hasta 1040px. Un solo color (--hue) para las respuestas marcadas;
   el resto de la interfaz va en tinta. Separaciones por borde de 1px, sin sombras en reposo (solo en lo que flota). */
:root{
  --ground:#f2f4f7;--surface:#ffffff;--raised:#eceff3;--active:#e8ecf2;
  --border:#e3e6eb;--rule:#eef0f3;--control:#cfd4db;
  --text:#0a0a0a;--muted:#5f6670;
  --primary:#141414;--primary-ink:#ffffff;
  --hue:#1d5fbf;--hue-ink:#ffffff;--hue-soft:#e3ecf8;
  --positive:#247b50;--negative:#c4242a;
  --pill-positive-bg:#dcfae5;--pill-positive-ink:#04250e;
  --pill-negative-bg:#ffedea;--pill-negative-ink:#831c1e;
  --pill-warning-bg:#fffbeb;--pill-warning-ink:#92400e;--pill-warning-line:#fde68a;
  --scrim:rgba(10,12,16,.45);
  --font:"Geist",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius-card:8px;--radius-control:6px;
  --side:256px;--gap:12px;--pad:24px;--control-height:36px;
  --fs-title:24px;--fs-section:16px;--fs-kpi:30px;--fs-body:14px;--fs-small:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0b0b0c;--surface:#141415;--raised:#1f2022;--active:#232427;
  --border:#26272a;--rule:#1d1e20;--control:#3b3d41;
  --text:#f2f2f2;--muted:#a6a8ad;
  --primary:#f2f2f2;--primary-ink:#0b0b0c;
  --hue:#7fabf5;--hue-ink:#07132a;--hue-soft:#18243a;
  --positive:#5cc58a;--negative:#f08c86;
  --pill-positive-bg:#16291d;--pill-positive-ink:#79d6a1;
  --pill-negative-bg:#2e1a1a;--pill-negative-ink:#f3a29b;
  --pill-warning-bg:#2b2213;--pill-warning-ink:#f1c27a;--pill-warning-line:#5a4520;
  --scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0b0b0c;--surface:#141415;--raised:#1f2022;--active:#232427;
  --border:#26272a;--rule:#1d1e20;--control:#3b3d41;
  --text:#f2f2f2;--muted:#a6a8ad;
  --primary:#f2f2f2;--primary-ink:#0b0b0c;
  --hue:#7fabf5;--hue-ink:#07132a;--hue-soft:#18243a;
  --positive:#5cc58a;--negative:#f08c86;
  --pill-positive-bg:#16291d;--pill-positive-ink:#79d6a1;
  --pill-negative-bg:#2e1a1a;--pill-negative-ink:#f3a29b;
  --pill-warning-bg:#2b2213;--pill-warning-ink:#f1c27a;--pill-warning-line:#5a4520;
  --scrim:rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);font-size:var(--fs-body);line-height:1.45;overscroll-behavior-y:none}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
button,[role="button"],label.check,label.switch{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--hue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:22px;padding:20px 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.canvas{min-width:0;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:1104px;padding-block:32px 128px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}

.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{flex:none;display:block}
.brand b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.brand span{display:block;font-size:var(--fs-small);color:var(--muted)}
.btn.side-close{display:none}

.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;font-weight:500;color:var(--muted)}
input[type=text],input[type=date],input[type=number]{font:inherit;font-size:16px;height:40px;padding:0 11px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);color:var(--text);width:100%;min-width:0}
input:focus{outline:2px solid var(--hue);outline-offset:-1px}
.pt{display:grid;gap:12px;padding:0 8px}

.nav-g{display:grid;gap:2px}
.nav-l{font-size:var(--fs-small);color:var(--muted);padding:0 8px 6px;user-select:none;-webkit-user-select:none;cursor:default}
.side .brand,.side .fld>span{user-select:none;-webkit-user-select:none}
.nav-i{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px;padding:0 10px;border:0;border-radius:var(--radius-control);background:transparent;cursor:pointer;text-align:left;font-size:14px}
.nav-i[aria-current="page"]{background:var(--active);font-weight:500}
.nav-i .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-l.sep{padding-top:14px}
.nav-i .c{font-size:var(--fs-small);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.nav-i.full .c{color:var(--positive)}
.side-foot{margin-top:auto;display:grid;gap:8px;padding:0 8px}
.file-status{font-size:var(--fs-small);color:var(--muted)}
.file-status.warn{color:var(--pill-warning-ink)}

/* Barra superior y pestañas (celular) */
.mtop{display:none}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--control-height);padding:0 14px;border-radius:var(--radius-control);border:1px solid var(--control);background:var(--surface);font-weight:500;font-size:14px;cursor:pointer;line-height:1.2;text-align:center;transition:transform .1s ease-out,background-color .12s}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.txt{border-color:transparent;background:transparent;padding:0 6px;color:var(--muted)}
.btn.wide{width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:progress}
.btn small{font-weight:400;color:var(--muted);font-size:var(--fs-small)}
.btn.pri small{color:inherit;opacity:.75}
@media (hover:hover) and (pointer:fine){
  .btn:not(:disabled):hover{border-color:var(--text)}
  .btn.pri:not(:disabled):hover{opacity:.88}
  .btn.txt:not(:disabled):hover{color:var(--text)}
  .nav-i:hover{background:var(--active)}
  .opt:hover,.big:hover{border-color:var(--hue)}
  .chip:hover{border-color:var(--text)}
}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--raised);border-radius:8px}
.seg button{border:0;background:transparent;min-height:32px;padding:0 14px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button{border:1px solid transparent}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:500;border-color:var(--border)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;color:var(--muted)}
.switch input{width:18px;height:18px;margin:0;accent-color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--control);background:var(--surface);border-radius:999px;min-height:36px;padding:0 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chip:active{transform:scale(.97)}

/* ---------- Encabezado de cada pantalla ---------- */
.panel{display:grid;gap:16px}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.head .ttl{font-size:var(--fs-title);font-weight:600;letter-spacing:-.01em;line-height:1.2}
.head .sub{margin-top:4px;font-size:15px;color:var(--muted)}
.head .sub b{color:var(--text);font-weight:500}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
details.instr{border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);padding:12px 16px}
details.instr summary{cursor:pointer;font-weight:500}
details.instr p{margin-top:8px;color:var(--muted);max-width:72ch}
.kbd{font-size:13px;color:var(--muted)}
.kbd kbd{font-family:inherit;font-size:12px;border:1px solid var(--control);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface);color:var(--text)}
@media (hover:none){.kbd{display:none}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card)}
.inf{padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}

/* ---------- Lista de ítems ---------- */
.items{overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 20px 8px;font-weight:600;font-size:15px;border-top:1px solid var(--border)}
.sec-h:first-child{border-top:0}
.sec-h small{font-weight:400;font-size:var(--fs-small);color:var(--muted)}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:10px 20px;border-top:1px solid var(--rule);scroll-margin:96px 0 120px}
.sec-h+.item,.items>.item:first-child{border-top-color:transparent}
.item.active{background:var(--active)}
.n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted);border:1px dashed var(--control)}
.item.done .n{border:1px solid transparent;background:var(--raised);color:var(--text)}
.item.active .n{border:1px solid var(--text);color:var(--text)}
.txt{font-size:15px;min-width:0}
.opts{display:grid;grid-template-columns:repeat(var(--n),var(--w,76px));gap:4px}
.opts.stack{grid-column:2/-1;grid-template-columns:minmax(0,1fr);gap:4px}
.item.ch{grid-template-columns:28px minmax(0,1fr)}
.opt.row{flex-direction:row;justify-content:flex-start;gap:12px;text-align:left;padding:8px 12px;font-size:14px;min-height:40px}
.opt.row .k{font-size:12px;min-width:18px;font-weight:600;color:var(--muted)}
.lead{padding:12px 20px 4px;font-weight:600}
.lead-one{font-size:14px;color:var(--muted);margin-bottom:6px}
.ex{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.ex li+li{margin-top:2px}
.opt{min-height:40px;padding:4px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1.15;text-align:center;transition:background-color .1s,border-color .1s,color .1s,transform .1s ease-out}
.opt .k{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt:active{transform:scale(.96)}
.opt.on{background:var(--hue);border-color:var(--hue);color:var(--hue-ink);font-weight:500}
.opt.on .k{color:inherit;opacity:.8}
@media (hover:none){.opt:not(.row) .k{display:none}}

/* ---------- De a una ---------- */
.one{padding:24px;display:grid;gap:20px}
.one-top{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.one-bar{height:4px;border-radius:2px;background:var(--raised);overflow:hidden;margin-top:-12px}
.one-bar i{display:block;height:100%;background:var(--text);transition:width .2s ease-out}
.one-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,400px);gap:20px 40px;align-items:start}
.one-side{display:grid;gap:16px}
.one-txt{font-size:22px;font-weight:500;line-height:1.35;letter-spacing:-.005em;max-width:36ch}
.one-opts{display:grid;gap:8px}
.big{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 18px;border:1px solid var(--control);border-radius:8px;background:var(--surface);cursor:pointer;font-size:16px;text-align:left;transition:background-color .1s,border-color .1s,color .1s,transform .1s ease-out}
.big .k{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.big.ch{justify-content:flex-start;gap:14px;font-size:15px;line-height:1.35;padding:10px 16px}
.big.ch .k{min-width:20px;font-weight:600}
.big:active{transform:scale(.98)}
.big.on{background:var(--hue);border-color:var(--hue);color:var(--hue-ink);font-weight:500}
.big.on .k{color:inherit;opacity:.8}
.one-nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.one-done{display:grid;gap:12px;justify-items:start}

/* ---------- Preguntas finales ---------- */
.final{padding:20px;display:grid;gap:20px}
.final h3{font-size:var(--fs-section);font-weight:600}
.fq{display:grid;gap:10px}
.fq>p{max-width:70ch}
.hint{font-size:13px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:40px;border:1px solid var(--control);border-radius:var(--radius-control);padding:0 12px;cursor:pointer;background:var(--surface)}
.check input{width:18px;height:18px;margin:0;accent-color:var(--primary)}
.age{display:flex;align-items:center;gap:8px}
.age input{width:96px}
.foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}

/* ---------- Barra inferior ---------- */
.dock{position:fixed;left:var(--side);right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:1104px;display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.dock-prog{flex:1;min-width:0;display:grid;gap:6px}
.dock-l{display:flex;gap:8px;align-items:baseline;font-size:14px;min-width:0}
.dock-l b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-l span{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--text);transition:width .25s ease-out}

/* ---------- Resultados ---------- */
.res{display:grid;gap:16px}
.rc{padding:20px;display:grid;gap:16px;min-width:0}
.rc-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.rc-h h2{font-size:var(--fs-section);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{flex:none;white-space:nowrap;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--pill-positive-bg);color:var(--pill-positive-ink)}
.pill.warn{background:var(--pill-warning-bg);color:var(--pill-warning-ink)}
.pill.neutral{background:var(--raised);color:var(--muted)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.lnk.strong{text-decoration:none;font-weight:600;font-size:15px;padding:0}
.ql{display:grid}
.qr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.qr:first-child{border-top:0;padding-top:0}
.qn{display:grid;gap:2px;min-width:0}
.qr .acts{display:flex;gap:6px}
.miss{font-size:13px;color:var(--pill-warning-ink)}
.note{padding:10px 12px;border-radius:var(--radius-control);font-size:14px}
.note.crit{background:var(--pill-negative-bg);color:var(--pill-negative-ink)}
.note.warn{background:var(--pill-warning-bg);color:var(--pill-warning-ink);border:1px solid var(--pill-warning-line)}
.lnk{background:none;border:0;padding:0 2px;cursor:pointer;text-decoration:underline;font-weight:500;color:inherit;font-variant-numeric:tabular-nums}
.dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;align-items:center}
.dl+.dl{border-top:1px solid var(--rule);padding-top:14px}
.dl b{font-weight:500;display:block}
.dl .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--radius-card)}
.kpi{padding:14px 16px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--border)}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-size:var(--fs-kpi);font-weight:400;line-height:1.2;font-variant-numeric:tabular-nums;margin-top:2px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--rule)}
th{font-size:12px;font-weight:400;color:var(--muted)}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0}
td.r,th.r{text-align:right;white-space:nowrap}
tr.tot td{font-weight:600}
tr.sub td:first-child{padding-left:16px;color:var(--muted)}
.meter{position:relative;height:6px;border-radius:3px;min-width:80px;background:var(--raised)}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--hue);border-radius:3px}
.fa{display:grid;gap:6px}
.privacy{font-size:13px;color:var(--muted)}

/* ---------- Lo que flota ---------- */
.modal{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);border-radius:12px;padding:20px;max-width:440px;width:100%;display:grid;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal-card h2{font-size:18px;font-weight:600}
.modal-card p{color:var(--muted)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--primary);color:var(--primary-ink);padding:10px 16px;border-radius:8px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.22)}
.toast.err{background:var(--negative);color:#fff}
.drop{position:fixed;inset:12px;z-index:80;border:2px dashed var(--hue);border-radius:16px;background:color-mix(in srgb,var(--surface) 88%,transparent);display:grid;place-items:center;font-size:18px;font-weight:500;pointer-events:none}

/* ---------- Tablet y celular ---------- */
@media (max-width:1100px){
  .opts:not(.stack){grid-template-columns:repeat(var(--n),calc(var(--w,76px) * .86))}
}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0;z-index:50;height:100dvh;background:var(--ground);border-right:0;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:none}
  body.menu .side{display:flex}
  .btn.side-close{display:inline-flex;margin-left:auto}
  .brand{padding:0}
  .pt,.side-foot,.nav-l{padding-left:0;padding-right:0}
  .nav-i{min-height:44px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:52px;background:var(--surface);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .mtop .who{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;cursor:pointer}
  .mtop .who b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mtop .who span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{padding-block:20px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .dock{left:0}

const BY={};INST.forEach(x=>{BY[x.id]=x;x.type=x.type||'scale';});

const itemText=(x,i)=>x.type==='choice'?x.groups[i].t:x.items[i];
/* Opciones de un ítem: {c: código que se muestra y se usa con el teclado, l: texto} */
function optsOf(x,i){
  if(x.type==='choice')return x.groups[i].o.map(p=>({c:p[0],l:p[1]}));
  return x.opts.map((l,j)=>({c:x.codes?x.codes[j]:String(j+1),l}));
}
const AREAS=['Escuela','Hogar','Trabajo','Relaciones sociales'];
const RELS=['Madre','Padre','Hermano','Hermana','Otros'];

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtDate=s=>{if(!s)return '—';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?m[3]+'/'+m[2]+'/'+m[1]:s;};
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60);
const plural=(n,a,b)=>n+' '+(n===1?a:b);

/* ---------- Estado ---------- */
const KEY='cuestionarios-tdah-v1',APP_ID='cuestionarios-tdah',DATA_SHEET='_datos_app',FMT=3;
const coarse=!!(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches);
function freshX(){return {bi:{informant:'',relation:'',other:'',impaired:null,areas:[]},ba:{informant:'',relation:'',other:'',impaired:null,onset:'',areas:[]},wurs:{edad:'',sexo:''},wursarg:{edad:'',sexo:''}};}
function fresh(ui){
  const r={};INST.forEach(x=>{r[x.id]=Array(nItems(x)).fill(null);});
  return {fmt:FMT,patient:{name:'',date:today()},r,x:freshX(),meta:{fileSavedAt:null,changes:0},
    ui:Object.assign({tab:'scl',auto:true,view:coarse?'one':'list'},ui||{})};
}
function cleanX(id,src){
  const f=freshX()[id];if(!src||typeof src!=='object')return f;
  Object.keys(f).forEach(p=>{
    if(p==='areas')f.areas=Array.isArray(src.areas)?AREAS.filter(a=>src.areas.indexOf(a)>=0):[];
    else if(p==='impaired')f.impaired=src.impaired==='Sí'||src.impaired==='No'?src.impaired:null;
    else if(p==='sexo')f.sexo=src.sexo==='V'||src.sexo==='M'?src.sexo:'';
    else if(p==='relation')f.relation=RELS.indexOf(src.relation)>=0?src.relation:'';
    else f[p]=src[p]==null?'':String(src[p]);
  });
  return f;
}
/* Valida un estado leído del navegador o de un archivo. Acepta también el formato anterior (solo SCL y BAARS). */
function normalize(o){
  if(!o||typeof o!=='object')return null;
  const f=fresh();let ok=false;
  if(o.r&&typeof o.r==='object'){
    INST.forEach(x=>{const a=o.r[x.id];if(Array.isArray(a)&&a.length===nItems(x)){f.r[x.id]=a.map((v,i)=>Number.isInteger(v)&&v>=0&&v<optsOf(x,i).length?v:null);ok=true;}});
    if(o.x&&typeof o.x==='object')Object.keys(f.x).forEach(id=>{f.x[id]=cleanX(id,o.x[id]);});
  }else{
    [['scl',0],['bi',1],['ba',1]].forEach(p=>{const id=p[0],off=p[1],s=o[id],x=BY[id];
      if(s&&Array.isArray(s.a)&&s.a.length===nItems(x)){f.r[id]=s.a.map(v=>Number.isInteger(v)&&v-off>=0&&v-off<x.opts.length?v-off:null);ok=true;if(id!=='scl')f.x[id]=cleanX(id,s);}});
  }
  if(!ok)return null;
  if(o.patient&&typeof o.patient==='object'){f.patient.name=String(o.patient.name||'');f.patient.date=String(o.patient.date||'')||today();}
  if(o.meta&&typeof o.meta==='object')f.meta={fileSavedAt:o.meta.fileSavedAt||null,changes:+o.meta.changes||0};
  if(o.ui&&typeof o.ui==='object'){if(BY[o.ui.tab]||o.ui.tab==='res')f.ui.tab=o.ui.tab;f.ui.auto=o.ui.auto!==false;if(o.ui.view==='one'||o.ui.view==='list')f.ui.view=o.ui.view;}
  return f;
}

function extrasMissing(id){if(BY[id].extra!=='wurs')return [];const e=S.x[id],m=[];if(!String(e.edad).trim())m.push('Edad');if(!e.sexo)m.push('Sexo');return m;}

const timeStr=iso=>{const d=new Date(iso);if(isNaN(d))return '';const p=n=>String(n).padStart(2,'0');return 'el '+p(d.getDate())+'/'+p(d.getMonth()+1)+' a las '+p(d.getHours())+':'+p(d.getMinutes());};
const optLabel=(x,i,v)=>{if(v==null)return 'Sin responder';const o=optsOf(x,i)[v];return x.codes||x.type==='choice'?o.c+' · '+o.l:o.l;};
const relText=id=>S.x[id].relation==='Otros'?('Otros'+(S.x[id].other?': '+S.x[id].other:'')):(S.x[id].relation||'—');
const areasText=id=>S.x[id].areas.length?S.x[id].areas.join(', '):'Ninguno marcado';

/* BAARS-IV: la hoja del formulario pide, para uso del profesional, la suma por sección y el número de síntomas (ítems con 3 o 4). */
function baarsScore(id){
  const a=S.r[id];
  const sec=(name,from,to,extra)=>{let s=0,c=0,sym=0;for(let i=from;i<=to;i++){const v=a[i-1];if(v!=null){s+=v+1;c++;if(v+1>=3)sym++;}}return Object.assign({name,from,to,sum:s,cnt:c,sym,size:to-from+1},extra||{});};
  const rows=[sec('Inatención',1,9),sec('Hiperactividad',10,14),sec('Impulsividad',15,18),sec('Secciones 1 y 2',1,14,{tot:true})];
  if(id==='ba')rows.push(sec('Tiempo cognitivo lento',19,27));
  return {rows,anyFreq:a.some(v=>v!=null&&v+1>=3),freq:a.filter(v=>v!=null&&v+1>=3).length};
}

const secOf=(x,n)=>x.sections?x.sections.find(s=>n>=s.from&&n<=s.to):null;
function optWidth(x){if(x.type==='choice')return 0;const L=Math.max.apply(null,x.opts.map(o=>o.length));return Math.min(112,Math.max(64,Math.round(L*6.4+20)));}

    const op=optsOf(x,i);

      h+='<div class="item ch" id="'+x.id+'-'+i+'" data-q="'+x.id+'" data-i="'+i+'"><div class="n">'+num+'</div><div class="txt"><b>'+esc(itemText(x,i))+'</b></div>'+
        '<div class="opts stack" role="radiogroup" aria-label="'+esc(itemText(x,i))+'">'+
        op.map((o,j)=>'<button type="button" class="opt row" role="radio" aria-checked="false" data-v="'+j+'"><span class="k">'+esc(o.c)+'</span><span>'+esc(o.l)+'</span></button>').join('')+'</div></div>';
    }else{
      h+='<div class="item" id="'+x.id+'-'+i+'" data-q="'+x.id+'" data-i="'+i+'"><div class="n">'+num+'</div><div class="txt">'+esc(itemText(x,i))+'</div>'+

    }
  }
  return h;
}

  let h=x.instr.map(p=>'<p>'+esc(p)+'</p>').join('');
  if(x.lead)h+='<p>'+esc(x.lead)+'</p>';

/* ---------- Pintar estado ---------- */
function paintItem(id,i){
  const el=document.getElementById(id+'-'+i);if(!el)return;const v=S.r[id][i];
  el.classList.toggle('done',v!=null);
  el.querySelectorAll('.opt').forEach(b=>{const on=v!=null&&+b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-checked',on?'true':'false');});
}
function setVal(sel,v){const el=document.getElementById(sel);if(el&&document.activeElement!==el)el.value=v||'';}
function paintExtras(id){
  const x=BY[id];if(!built[id]||!x.extra)return;const e=S.x[id];
  if(x.extra==='wurs'){
    setVal(id+'-edad',e.edad);
    document.querySelectorAll('[data-act="sexo"][data-q="'+id+'"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===e.sexo?'true':'false'));
    return;
  }
  setVal(id+'-informant',e.informant);setVal(id+'-other',e.other);
  document.getElementById(id+'-other-wrap').hidden=e.relation!=='Otros';
  document.querySelectorAll('[data-act="rel"][data-q="'+id+'"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===e.relation?'true':'false'));
  document.querySelectorAll('[data-act="yn"][data-q="'+id+'"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===e.impaired?'true':'false'));
  AREAS.forEach((a,ix)=>{document.getElementById(id+'-area-'+ix).checked=e.areas.indexOf(a)>=0;});
  if(id==='ba')setVal('ba-onset',e.onset);
  const sc=baarsScore(id);
  document.getElementById(id+'-yn-hint').textContent=answered(id)?('Ítems marcados con 3 o 4 hasta ahora: '+sc.freq+'.'):'';
}
function paintPatient(){setVal('pt-name',S.patient.name);setVal('pt-date',S.patient.date);}
function paintFileStatus(){
  const m=S.meta,el=$('#file-status');let t,warn=false;
  if(!m.fileSavedAt){t=hasData()?'Todavía no guardaste un archivo de avance. El navegador guarda una copia, pero conviene tener el archivo.':'Guardá el avance en un archivo para seguir otro día o en otro dispositivo.';warn=hasData();}
  else if(!m.changes)t='Archivo guardado '+timeStr(m.fileSavedAt)+'. Sin cambios después.';
  else{t='Archivo guardado '+timeStr(m.fileSavedAt)+'. '+plural(m.changes,'cambio','cambios')+' sin guardar.';warn=m.changes>=10;}
  el.textContent=t;el.classList.toggle('warn',warn);
}

/* ---------- Navegación ---------- */
function showTab(t){
  if(!(BY[t]||t==='res'))t='scl';
  S.ui.tab=t;save();closeMenu();
  if(BY[t])ensurePanel(t);
  document.querySelectorAll('.nav-i').forEach(b=>{if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});

  window.scrollTo(0,0);
  if(t==='res')renderResults();else{setActive(t,active[t],false);if(S.ui.view==='one')renderOne(t);}
  document.querySelectorAll('.panel .ttl').forEach(h=>{const want=h.closest('.panel').id==='panel-'+t?'H1':'H2';if(h.tagName!==want){const nh=document.createElement(want);nh.className='ttl';nh.innerHTML=h.innerHTML;h.replaceWith(nh);}});
  updateTop();updateDock();

function setActive(id,i,scroll){
  active[id]=Math.max(0,Math.min(i,nItems(BY[id])-1));i=active[id];
  document.querySelectorAll('#items-'+id+' .item.active').forEach(e=>e.classList.remove('active'));
  const el=document.getElementById(id+'-'+i);
  if(el){el.classList.add('active');if(scroll&&S.ui.view!=='one')el.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});}
  if(S.ui.view==='one'&&S.ui.tab===id)renderOne(id);
  updateDock();
}
let advT=null;
function answer(id,i,v,src){
  const x=BY[id],len=nItems(x),before=answered(id);
  S.r[id][i]=v;paintItem(id,i);touch();paintExtras(id);updateProgress();
  clearTimeout(advT);
  if(src==='cycle'){setActive(id,i,false);}
  else if(S.ui.view==='one'){renderOne(id);if(i+1<len)advT=setTimeout(()=>{if(active[id]===i)setActive(id,i+1,false);},src==='key'?60:200);}
  else if(src==='key')setActive(id,i+1<len?i+1:i,true);
  else if(S.ui.auto&&i+1<len&&S.r[id][i+1]==null){setActive(id,i,false);advT=setTimeout(()=>setActive(id,i+1,true),130);}
  else setActive(id,i,false);
  if(before<len&&answered(id)===len){
    const ex=extrasMissing(id);
    toast(x.name+': todos los ítems respondidos.'+(ex.length?' Falta completar '+ex.join(' y ').toLowerCase()+'.':'')+(x.extra==='baars'?' Quedan las preguntas finales.':''));

let modalOk=null;
function ask(title,text,okLabel,fn){$('#modal-t').textContent=title;$('#modal-p').textContent=text;$('#modal-ok').textContent=okLabel;modalOk=fn;$('#modal').hidden=false;$('#modal-ok').focus();}

$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
let toastT=null;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast'+(kind==='err'?' err':'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},kind==='err'?6000:3200);}

/* ---------- Archivo de avance ---------- */
async function saveProgress(){if(await saveFile('TDAH_avance_'+base()+'.json',JSON.stringify(snapshot(),null,1)))markSaved();}
function markSaved(){S.meta.fileSavedAt=new Date().toISOString();S.meta.changes=0;save();paintFileStatus();}
function pickFile(){const f=$('#file-in');f.value='';f.click();}
const readAs=(file,kind)=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(new Error('No se pudo leer el archivo.'));if(kind==='text')fr.readAsText(file);else fr.readAsArrayBuffer(file);});
async function readProgressFile(file){
  if((file.name||'').toLowerCase().endsWith('.xlsx')){
    await needExcel();
    const wb=new window.ExcelJS.Workbook();await wb.xlsx.load(await readAs(file,'buffer'));
    const ws=wb.getWorksheet(DATA_SHEET);
    if(!ws)throw new Error('Este Excel no tiene los datos de la app. Solo se pueden abrir los Excel descargados desde aquí.');
    let raw='';ws.eachRow(r=>{const v=r.getCell(1).value;raw+=typeof v==='string'?v:(v&&v.richText?v.richText.map(t=>t.text).join(''):'');});
    return JSON.parse(raw);
  }
  return JSON.parse(await readAs(file,'text'));
}
async function openProgress(file){
  if(!file)return;
  let obj;
  try{obj=await readProgressFile(file);}
  catch(err){toast(err&&err.message&&!/JSON|Unexpected|token/i.test(err.message)?err.message:'No se pudo leer el archivo. Elegí un .json de avance o un Excel descargado desde la app.','err');return;}
  const st=normalize(obj&&obj.state?obj.state:obj);
  if(!st){toast('El archivo no tiene respuestas de estos cuestionarios.','err');return;}
  const ids=IDS.filter(id=>st.r[id].some(v=>v!=null));
  const who=st.patient.name||'paciente sin nombre',when=obj&&obj.savedAt?' (guardado '+timeStr(obj.savedAt)+')':'';
  const apply=()=>{
    const ui=S.ui;S=st;S.ui=Object.assign({},ui);
    S.meta={fileSavedAt:obj&&obj.savedAt||new Date().toISOString(),changes:0};
    IDS.forEach(id=>{const j=nextUnanswered(id,0);active[id]=j<0?0:j;});
    save();paintAll();
    const nx=ids.find(id=>!complete(id));
    showTab(nx||'res');
    if(nx)setActive(nx,active[nx],true);
    toast('Avance de '+who+' abierto: '+plural(ids.length,'cuestionario','cuestionarios')+' con respuestas.'+(nx?' Seguís en '+BY[nx].name+', '+(BY[nx].type==='choice'?'grupo ':'ítem ')+(active[nx]+1)+'.':''));
  };
  if(hasData())ask('Abrir el avance de '+who,'El archivo'+when+' tiene respuestas en '+plural(ids.length,'cuestionario','cuestionarios')+'. Reemplaza lo que está cargado ahora en esta pantalla.','Abrir avance',apply);
  else apply();
}
$('#file-in').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)openProgress(f);});
let dragN=0;
const hasFiles=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).indexOf('Files')>=0;
document.addEventListener('dragenter',e=>{if(hasFiles(e)){dragN++;$('#drop').hidden=false;}});
document.addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1);if(!dragN)$('#drop').hidden=true;});
document.addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault();});
document.addEventListener('drop',e=>{dragN=0;$('#drop').hidden=true;const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f){e.preventDefault();openProgress(f);}});

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const big=e.target.closest('.big');
  if(big){const id=S.ui.tab;answer(id,active[id],+big.dataset.v,'one');return;}
  const opt=e.target.closest('.opt');
  if(opt){const it=opt.closest('.item');answer(it.dataset.q,+it.dataset.i,+opt.dataset.v,'click');return;}
  const item=e.target.closest('.item');
  if(item){setActive(item.dataset.q,+item.dataset.i,false);return;}
  const tab=e.target.closest('[data-tab]');
  if(tab&&!tab.dataset.act){showTab(tab.dataset.tab);return;}
  const el=e.target.closest('[data-act]');
  if(el)act(el.dataset.act,el);
});
const keysOf=v=>v==='all'?(startedIds().length?startedIds():IDS.slice()):v.split(',');
function act(a,el){
  const id=el.dataset.q,t=S.ui.tab;
  if(a==='goto')showTab(el.dataset.tab);
  else if(a==='jump'){showTab(id);setActive(id,+el.dataset.i,true);}
  else if(a==='prev'){clearTimeout(advT);setActive(t,active[t]-1,false);}
  else if(a==='next'){clearTimeout(advT);setActive(t,active[t]+1,false);}
  else if(a==='view'){
    S.ui.view=el.dataset.v;save();paintView();
    if(BY[t]){const one=S.ui.view==='one',j=one&&S.r[t][active[t]]!=null?nextUnanswered(t,active[t]):-1;setActive(t,j>=0?j:active[t],!one);}
  }
  else if(a==='menu-open')openMenu();
  else if(a==='menu-close')closeMenu();
  else if(a==='rel'){S.x[id].relation=S.x[id].relation===el.dataset.v?'':el.dataset.v;touch();paintExtras(id);if(S.x[id].relation==='Otros')document.getElementById(id+'-other').focus();}
  else if(a==='yn'){S.x[id].impaired=S.x[id].impaired===el.dataset.v?null:el.dataset.v;touch();paintExtras(id);}
  else if(a==='sexo'){S.x[id].sexo=S.x[id].sexo===el.dataset.v?'':el.dataset.v;touch();paintExtras(id);updateProgress();}
  else if(a==='new'){
    const go=()=>{S=fresh(S.ui);IDS.forEach(k=>{active[k]=0;built[k]&&(document.getElementById('panel-'+k).innerHTML='');built[k]=false;});save();paintAll();showTab('scl');toast('Listo para un paciente nuevo');};
    if(!hasData()){go();return;}
    ask('Empezar con un paciente nuevo',S.meta.changes||!S.meta.fileSavedAt?'Hay respuestas que no guardaste en un archivo de avance. Si seguís, se borran de este dispositivo.':'Se borran las respuestas cargadas en este dispositivo. El archivo de avance que guardaste no cambia.','Borrar y empezar',go);
  }
  else if(a==='save-progress')busy(el,saveProgress);
  else if(a==='open-progress'){closeMenu();pickFile();}
  else if(a==='xls')busy(el,()=>exportExcel(keysOf(el.dataset.keys)));
  else if(a==='pdf')busy(el,()=>exportPdf(keysOf(el.dataset.keys)));
  else if(a==='zip')busy(el,exportZip);
}
$('#dock-btn').addEventListener('click',e=>{
  const go=e.currentTarget.dataset.go,t=S.ui.tab;
  if(go==='item'){const j=nextUnanswered(t,active[t]);if(j>=0)setActive(t,j,true);}
  else if(go==='extras'){const f=document.getElementById(t+'-extras');if(f){f.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});const inp=f.querySelector('input');if(inp&&!inp.value)inp.focus();}}
  else if(go==='save')busy(e.currentTarget,saveProgress);
  else showTab(go);
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;let m;
  if(id==='pt-name'){S.patient.name=t.value;paintPatient();updateTop();}
  else if(id==='pt-date')S.patient.date=t.value;
  else if((m=/^(bi|ba)-(informant|other)$/.exec(id)))S.x[m[1]][m[2]]=t.value;
  else if((m=/^(wurs|wursarg)-edad$/.exec(id))){S.x[m[1]].edad=t.value;updateProgress();}
  else if(id==='ba-onset')S.x.ba.onset=t.value;
  else return;
  touch();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('auto-t')){S.ui.auto=t.checked;document.querySelectorAll('.auto-t').forEach(c=>{c.checked=t.checked;});save();}
  else if(t.dataset.area){const id=t.dataset.q,a=t.dataset.area,arr=S.x[id].areas.filter(z=>z!==a);if(t.checked)arr.push(a);S.x[id].areas=AREAS.filter(z=>arr.indexOf(z)>=0);touch();}
});
/* Tecla → opción: el número que se ve en el botón. En el BDI-II, repetir 1, 2 o 3 alterna entre a y b. */
function keyToOpt(x,i,key,cur){
  const ops=optsOf(x,i),cand=[];ops.forEach((o,j)=>{if(x.type==='choice'?o.c[0]===key:o.c===key)cand.push(j);});
  if(!cand.length)return null;const p=cand.indexOf(cur);return {j:p>=0?cand[(p+1)%cand.length]:cand[0],multi:cand.length>1};
}
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return;}
  if(document.body.classList.contains('menu')){if(e.key==='Escape')closeMenu();return;}
  const t=e.target;
  if(t&&t.closest&&t.closest('input,textarea,select'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const id=S.ui.tab,x=BY[id];if(!x)return;
  const i=active[id],one=S.ui.view==='one';
  if(/^[0-9]$/.test(e.key)){const k=keyToOpt(x,i,e.key,S.r[id][i]);if(k){e.preventDefault();answer(id,i,k.j,k.multi?'cycle':'key');}return;}
  if(e.key==='ArrowDown'||(one&&e.key==='ArrowRight')){e.preventDefault();clearTimeout(advT);setActive(id,i+1,true);}
  else if(e.key==='ArrowUp'||(one&&e.key==='ArrowLeft')){e.preventDefault();clearTimeout(advT);setActive(id,i-1,true);}

const loaded={};
function loadScript(src){
  if(!loaded[src])loaded[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete loaded[src];s.remove();rej(new Error('no se pudo cargar una librería; revisá la conexión a internet'));};document.head.appendChild(s);});
  return loaded[src];

let dlP=null;
function getDl(){
  if(!(window.claude&&typeof window.claude.use==='function'))return Promise.resolve(undefined);
  if(!dlP)dlP=Promise.resolve().then(()=>window.claude.use('downloads')).catch(()=>null);
  return dlP;
}
const MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pdf:'application/pdf',zip:'application/zip',json:'application/json'};
/* Devuelve true si el archivo se entregó para guardar. */
async function saveFile(name,data){
  const dl=await getDl();
  if(dl===undefined){
    const blob=data instanceof Blob?data:new Blob([data],{type:MIME[name.split('.').pop()]||'application/octet-stream'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Descargado: '+name);return true;
  }
  if(!dl){toast('Las descargas no están disponibles en esta vista. Abrí la página en el navegador o en la app de Claude actualizada.','err');return false;}
  try{await dl.save({filename:name,data:data});toast('Guardado: '+name);return true;}
  catch(err){const c=err&&err.code;
    if(c==='declined')toast('Descarga cancelada');
    else if(c==='rate_limited')toast('Ya hay una descarga esperando confirmación.','err');
    else toast('No se pudo descargar ('+(c||'error')+').','err');
    return false;}
}
async function busy(el,fn){
  if(el.disabled)return;const html=el.innerHTML;el.disabled=true;el.setAttribute('aria-busy','true');el.textContent='Generando…';

  finally{el.disabled=false;el.removeAttribute('aria-busy');el.innerHTML=html;}
}

  await needPdf();
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  doc.setProperties({title:keys.map(id=>BY[id].name).join(' + ')+' - '+(S.patient.name||'paciente')});
  keys.forEach((id,i)=>{if(i)doc.addPage();const x=BY[id];if(x.type==='choice')pdfChoice(doc,x);else pdfScale(doc,x);});
  pdfFooter(doc);
  return doc.output('arraybuffer');
}
async function exportPdf(keys){
  const buf=await buildPdf(keys);
  await saveFile((keys.length>1?'Cuestionarios_':fileOf(keys[0])+'_')+base()+'.pdf',buf);
}
async function exportZip(){
  await Promise.all([needZip(),needExcel(),needPdf()]);
  const keys=keysOf('all'),zip=new window.JSZip(),b=base();
  zip.file('Cuestionarios_'+b+'.xlsx',await buildXlsx(keys));
  for(const id of keys)zip.file(fileOf(id)+'_'+b+'.pdf',await buildPdf([id]));
  zip.file('TDAH_avance_'+b+'.json',JSON.stringify(snapshot(),null,1));
  const blob=await zip.generateAsync({type:'blob'});
  if(await saveFile('Cuestionarios_'+b+'.zip',blob))markSaved();
}

IDS.forEach(id=>{const j=nextUnanswered(id,0);active[id]=j<0?0:j;});
showTab(S.ui.tab);
getDl();
})();
